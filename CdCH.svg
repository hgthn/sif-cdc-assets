<?xml version="1.0" encoding="UTF-8"?>
<svg width="32px" height="32px" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond transparent -->
  <rect width="32" height="32" fill="none"/>
  
  <!-- Cauri simplifié 1 - haut -->
  <g transform="translate(16,9)">
    <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#B87333"/>
    <path d="M-5.5,0 Q0,-3.5,5.5,0" stroke="#8B5A2B" stroke-width="1.8" fill="none"/>
    <path d="M-5.5,0 Q0,2,5.5,0" stroke="#D4AF37" stroke-width="0.8" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Cauri simplifié 2 - bas gauche -->
  <g transform="translate(10,20) rotate(-120)">
    <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#B87333"/>
    <path d="M-5.5,0 Q0,-3.5,5.5,0" stroke="#8B5A2B" stroke-width="1.8" fill="none"/>
    <path d="M-5.5,0 Q0,2,5.5,0" stroke="#D4AF37" stroke-width="0.8" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Cauri simplifié 3 - bas droite -->
  <g transform="translate(22,20) rotate(120)">
    <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#B87333"/>
    <path d="M-5.5,0 Q0,-3.5,5.5,0" stroke="#8B5A2B" stroke-width="1.8" fill="none"/>
    <path d="M-5.5,0 Q0,2,5.5,0" stroke="#D4AF37" stroke-width="0.8" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Texte CdCH blanc très bold + contour bronze -->
  <text x="16" y="19.5" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" stroke="#8B5A2B" stroke-width="0.8" text-anchor="middle" paint-order="stroke fill">CdCH</text>
</svg>
